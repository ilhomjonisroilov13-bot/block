name: APK yig'ish

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: APK yig'ish
        run: |
          set +e
          gradle assembleDebug --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^e: |What went wrong|error:" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: SozQalqoni-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: APK'ni Releases sahifasiga chiqarish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "So'z Qalqoni APK (${{ github.run_number }})" \
            --notes "Telefonga yuklab olib o'rnating: app-debug.apk"
